  field_body:
    -
      value: '<p>Single Directory Components (SDC) are now the standard way to build reusable UI in Drupal core. Instead of scattering a component across a template file, a preprocess hook, and a global stylesheet, SDC keeps the Twig template, its CSS and JS, and a schema-validated definition together in one folder. This article walks through the pattern using <strong>Jarvis</strong>, a DXPR-style Drupal 11 theme built on Bootstrap 5 for Drupal Canvas and Layout Builder, as a concrete reference.</p><hr><h3>What Single Directory Components Are</h3><p>An SDC groups everything needed to render one UI component inside a single directory. A component folder holds a Twig template, an optional CSS and JS file, and a <code>*.component.yml</code> definition that declares the component name, category, and a typed schema of its props. Because the schema is JSON Schema, Drupal validates prop values, and tools such as Canvas render an editing form for the component automatically.</p><p>The payoff: components become portable building blocks with an explicit, documented API instead of implicit template variables.</p><h3>Why SDC Helps Theme Development</h3><ul><li><strong>Encapsulation:</strong> markup, styles, and behaviour live together, so a component cannot accidentally leak styles into the rest of the page.</li><li><strong>Typed props:</strong> the schema defines required props, enums, and defaults, catching bad data before it reaches Twig.</li><li><strong>Reuse across contexts:</strong> the same component renders inside nodes, Views, blocks, and Layout Builder or Canvas sections.</li><li><strong>Tooling:</strong> because the API is declared, page builders expose a form for every prop with no extra code.</li></ul><hr><h3>Theme Structure</h3><p>Jarvis keeps every component under a single <code>components/</code> directory. The theme file wires up global assets and regions; each component owns its own assets.</p><p><strong>Real structure of the Jarvis theme:</strong></p><ul><li><strong>web/themes/custom/jarvis/</strong><ul><li>jarvis.info.yml — declares <code>core_version_requirement: ^11 || ^12</code>, a <code>jarvis/global</code> library, and named regions (header, hero, sidebar_left, content, sidebar_right, footer, and more).</li><li>jarvis.libraries.yml</li><li>components/<ul><li>button/ · card/ · cta/ · hero/ · stat/ · person/ · image/ · video/ · map/ · text/ · wysiwyg/</li><li>section/ · one-column/ · two-column/ · three-column/ — layout wrappers that hold other components in a slot.</li></ul></li></ul></li></ul><p>Twenty components ship in the library, split between content pieces (button, card, stat, hero, person) and layout wrappers (section and the column components).</p><hr><h3>Anatomy of a Component</h3><p>Take the Jarvis <strong>card</strong>. Its folder contains exactly three files:</p><ul><li><code>card.twig</code> — markup that consumes the props.</li><li><code>card.component.yml</code> — the schema and metadata.</li><li><code>card.css</code> — styles scoped to the card.</li></ul><p>Nothing about the card lives outside this folder, so deleting the folder removes the component cleanly.</p><h4>Defining Props with a Schema</h4><p>The definition file documents the component API. Jarvis leans on JSON Schema features to keep props safe and self-describing:</p><ul><li><strong>Required props:</strong> the card marks <code>title</code> as required, so it can never render empty.</li><li><strong>Constrained variants:</strong> the card <code>variant</code> prop is an enum of <code>image-top</code>, <code>image-left</code>, <code>image-right</code>, and <code>background</code>, with human labels supplied through <code>meta:enum</code>. The button follows the same pattern with Bootstrap styles (<code>primary</code>, <code>secondary</code>, <code>outline-primary</code>, and so on) plus a <code>size</code> enum.</li><li><strong>Sensible defaults:</strong> optional props such as the card overlay opacity (default 40) and the section background (default none) prevent rendering edge cases.</li><li><strong>Examples:</strong> each prop carries an <code>examples</code> value, so preview tooling has real content to show.</li></ul><hr><h3>Layout Versus Content Components</h3><p>Jarvis separates two kinds of component. Content components (card, stat, button, person) render a single piece of UI. Layout components wrap other components in a Twig slot.</p><ul><li><strong>section</strong> is the primary container. Its schema exposes <code>width</code> (contained or full), <code>bg</code> (none, light, dark, primary, subtle grey), and <code>padding</code> controls: a Bootstrap-flavoured section wrapper editors configure without touching code.</li><li><strong>one-column, two-column, three-column</strong> provide responsive column grids that hold nested components.</li></ul><p>Composing a page then means dropping content components into layout slots, all through declared props.</p><hr><h3>Bootstrap 5 and Canvas Integration</h3><p>Jarvis is a Bootstrap 5 theme, so component variants map directly onto Bootstrap utilities and button classes. Because the theme is built for <strong>Drupal Canvas</strong> and Layout Builder, every SDC appears in the visual editor with a generated form for its props.</p><p><strong>One gotcha worth knowing:</strong> Canvas pins a placed component to the schema <em>version</em> it was saved under. If you change a prop later, for example converting a free-text field into an enum, existing instances keep rendering under their pinned version until they are re-placed or migrated. Plan prop changes with that in mind.</p><hr><h3>Accessibility Built Into the Schema</h3><p>SDC props are a natural place to enforce accessibility. Jarvis ships a <code>jarvis/contrast</code> library that several components depend on, and it uses the schema itself to prevent inaccessible choices:</p><ul><li>The card <code>text_color</code> prop only offers light or dark. A primary-colour text option was deliberately removed, because a coloured hue over a photo cannot be made WCAG-compliant just by darkening the overlay.</li><li>The stat card <code>number_color</code> prop falls back to the section safe text colour automatically when a chosen colour cannot meet contrast on its background.</li></ul><p>Encoding these rules in the component means editors get accessible output by default rather than as an afterthought.</p><hr><h3>Mapping Media and Drupal Data to Props</h3><p>Props are not limited to strings. Jarvis media components reference Drupal media through a schema <code>$ref</code>: the stat icon and image components point at <code>canvas.module/image</code>, which gives editors a media picker instead of a raw path field. For node and View templates, preprocess functions still shape render arrays and fields into clean props before Twig runs.</p><hr><h3>Adopting SDC Incrementally</h3><p>Building a component theme does not require a full rewrite.</p><ol><li>Start with a few shared components; a button and a card cover a surprising amount of a site.</li><li>Give each one a tight schema: required props, enum variants, and defaults.</li><li>Add a layout wrapper such as section, so components can be composed on a page.</li><li>Move component styles out of global CSS and into the component folder.</li><li>Push accessibility rules into the schema, so bad choices are simply not offered.</li></ol><hr><h3>Conclusion</h3><p>Single Directory Components turn a Drupal 11 theme into a documented design system. Jarvis shows the pattern in practice: twenty self-contained components, typed and constrained schemas, Bootstrap 5 styling, first-class Canvas integration, and accessibility encoded directly into the props. Start with a couple of foundational components, keep their APIs honest, and grow the library as repeated UI needs appear.</p>'
