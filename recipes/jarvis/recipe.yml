name: 'Jarvis'
description: 'Bootstraps a new Drupal site with the Jarvis theme: custom modules, Canvas + media plumbing, the Blog/Basic/Landing content types, and curated demo content (home page, blog posts, about page, media). Installs AND configures the AI stack (providers, Canvas agents, CKEditor AI, alt-text) — everything except API keys, which ship separately via the private jarvis_ai overlay. Contains no secrets; safe to share.'
type: 'Site'
install:
  # Core + contrib plumbing
  - media
  - media_library
  - image
  - link
  - menu_ui
  - menu_link_content
  - datetime
  - options
  - path
  - navigation
  - block_content
  - layout_builder
  - editor
  - ckeditor5
  - help
  - default_content
  - twig_tweak
  - linkit
  - token
  - token_filter
  - crop
  - focal_point
  - canvas
  - canvas_field_component
  - backup_migrate
  - asset_injector
  - simple_gmap
  # Editorial accessibility checker — flags content-level WCAG issues (missing
  # alt, skipped headings, vague link text) inline for editors; complements the
  # theme's build-time contrast safeguards.
  - editoria11y
  - modeler_api
  # AI stack — installed unconfigured, NO keys ship here
  - key
  - ai
  - ai_agents
  # Both shipped editors carry the ai_automators_ckeditor toolbar plugin.
  - ai_automators
  - ai_ckeditor
  # Provides the markdownPaste toolbar item that editor.editor.jarvis_html
  # uses. Without it the recipe aborts: "The provided toolbar item
  # markdownPaste is not valid."
  - ckeditor5_markdown
  - ai_assistant_api
  - ai_chatbot
  - ai_image_alt_text
  - ai_media_image
  - ai_provider_anthropic
  - ai_provider_openai
  - gemini_provider
  # TTS provider — ai.settings' default text_to_speech points at it; the
  # shipped elevenlabs.settings references the key entity id `elevenlabs`
  # (supplied by the private jarvis_ai overlay), not a secret.
  - elevenlabs
  - canvas_ai
  # Admin UX: the navigation sidebar's Shortcuts block needs the shortcut
  # module; Claro is the admin theme (set in config actions below).
  - shortcut
  - claro
  # Site-builder UIs + stock performance/cron (standard-profile parity).
  - field_ui
  - views_ui
  - big_pipe
  - automated_cron
  # Editorial workflow.
  - workflows
  - content_moderation
  # SEO: metatag defaults (global/node/front/403/404 etc.) via config.import.
  - metatag
  - metatag_open_graph
  - metatag_twitter_cards
  # Forms.
  - webform
  - webform_node
  - webform_ui
  - webform_submission_export_import
  # UX/editor helpers.
  - antibot
  - extlink
  - back_to_top
  - coffee
  - save_edit
  - better_exposed_filters
  - better_social_sharing_buttons
  # Custom modules shipped in this codebase
  - jarvis_blocks
  - jarvis_canvas
  # The theme itself. Recipes install themes from this same list, before config
  # import and config actions run. Without it, a site that has not already run
  # `theme:install jarvis` has no auto-created blocks for the block.block.*
  # actions to act on, and the recipe aborts with "Entity ... does not exist".
  - jarvis
  # The theme
  - jarvis
config:
  # Core defaults `strict` to TRUE, which compares EVERY config name this
  # recipe can supply — the ~217 files in config/ plus the ~133 names the
  # import list below pulls out of other extensions — against the site's
  # active config, and throws RecipePreExistingConfigException on the first
  # byte that differs. On an existing site that is a hair trigger: a site that
  # added a column to views.view.content, or tweaked image.style.large, or
  # already runs Canvas, never gets past validation. Nested uuids are not
  # normalised either, so a hand-built image style with identical settings
  # still fails on its effect uuids.
  #
  # FALSE instead: pre-existing config is left alone and only the names the
  # site does not already have are created. The trade-off is silence — where
  # the site owns a drifted copy, the recipe's version never lands and nothing
  # says so. Flip back to TRUE (or list the names that genuinely must match)
  # if fail-fast matters more than applying to an existing site.
  strict: false
  # Recipes deliberately skip config ENTITIES shipped by the modules they
  # install (RecipeRunner sets the config installer to syncing during module
  # install) — without this import list the site has no admin views
  # (content/media/files/people listings), no media_library image style, no
  # navigation menus, no shortcut set: the admin UI looks gutted. Importing
  # creates only what does not already exist, straight from each module's
  # config/install + config/optional.
  import:
    ai_automators: '*'
    metatag: '*'
    webform: '*'
    content_moderation: '*'
    workflows: '*'
    navigation: '*'
    shortcut: '*'
    # Claro's default admin blocks (local task tabs, page title, messages,
    # help, breadcrumbs). The standard profile pre-creates these; on minimal
    # they are absent, so Manage fields/display/Permissions tabs disappear
    # from admin pages. Import creates only what is missing.
    claro: '*'
    node: '*'
    media: '*'
    media_library: '*'
    block_content: '*'
    file: '*'
    taxonomy: '*'
    dblog: '*'
    canvas: '*'
    editoria11y: '*'
    backup_migrate: '*'
    linkit: '*'
    user:
      # Explicit: user/optional also ships search.page.user_search, whose
      # search-module dependency is not installed here.
      - views.view.user_admin_people
      # The User / Lists component folders reference these views' blocks.
      - views.view.who_s_new
      - views.view.who_s_online
  actions:
    # The recipe ships filter.format.jarvis_html and jarvis_full_html plus their
    # CKEditor configs, but shipped nothing that lets anyone USE them. Text
    # formats are permission-gated, so before this only uid 1 (which bypasses
    # every permission check) could edit rich text: content_editor -- the role
    # the standard profile creates for exactly this job -- got no usable format
    # in the Canvas WYSIWYG prop or in the card/text body fields, both of which
    # allow only these two formats.
    #
    # jarvis_html keeps filter_html enabled, so it is a restricted format and is
    # granted to authenticated, mirroring how core grants basic_html.
    # jarvis_full_html has filter_html DISABLED -- unrestricted, script-capable,
    # the equivalent of core's full_html, which core grants to no role at all.
    # It is deliberately left to administrators; granting it more widely would
    # be a stored-XSS vector.
    user.role.authenticated:
      grantPermission: 'use text format jarvis_html'
    # Theme install auto-creates a block for each region-matched block of the
    # outgoing default theme, all landing in `header`, and Canvas auto-creates
    # component entities during module/theme install. A recipe refuses to import
    # config that already exists and differs, so shipping these as config files
    # aborted the install. Acting on the auto-created config instead is what the
    # recipe README always described.
    # Canvas creates block component entities lazily on rebuild, not at module
    # install. If the theme was installed first it already exists (disabled) and
    # only needs enabling; if the recipe is installing Canvas itself it does not
    # exist yet and canvas.page_region.jarvis.page_title cannot validate without
    # it. Cover both.
    # Shipped with status:false so it matches what Canvas auto-creates and never
    # collides; canvas.page_region.jarvis.page_title needs it to exist at config
    # import time, and this action turns it on afterwards.
    canvas.component.block.page_title_block:
      setStatus: true
    canvas.component.sdc.navigation.message:
      setStatus: false
    canvas.component.sdc.navigation.title:
      setStatus: false
    filter.format.canvas_html_block:
      simpleConfigUpdate:
        weight: -6
    filter.format.canvas_html_inline:
      simpleConfigUpdate:
        weight: -5
    system.theme:
      simpleConfigUpdate:
        default: jarvis
        admin: claro
    node.settings:
      simpleConfigUpdate:
        # Edit/add content in the admin theme, like the standard profile.
        use_admin_theme: true
    system.site:
      simpleConfigUpdate:
        # Canvas home page ("Jarvis Drupal Theme…", uuid c59c9f00…) — imported
        # after Test Page, so it gets canvas_page ID 2, matching the reference site.
        page.front: /page/2
    core.entity_view_mode.node.full:
      simpleConfigUpdate:
        # Standard ships the Full content view mode DISABLED. Enable it so the
        # Canvas content templates (basic/blog/landing_page full) surface on
        # each type's Manage display page.
        status: true
