langcode: en
status: true
dependencies:
  config:
  - filter.format.jarvis_html
  module:
  - ckeditor5
format: jarvis_html
editor: ckeditor5
settings:
  toolbar:
    items:
    - drupalMedia
    - bold
    - italic
    - underline
    - superscript
    - subscript
    - specialCharacters
    - link
    - horizontalLine
    - alignment
    - heading
    - '-'
    - bulletedList
    - numberedList
    - blockQuote
    - code
    - sourceEditing
    - fullscreen
  plugins:
    ckeditor5_alignment:
      enabled_alignments:
      - center
      - justify
      - left
      - right
    ckeditor5_heading:
      enabled_headings:
      - heading2
      - heading3
      - heading4
      - heading5
      - heading6
    ckeditor5_list:
      properties:
        reversed: true
        startIndex: true
        styles: true
      multiBlock: true
    ckeditor5_sourceEditing:
      allowed_tags:
      - <cite>
      - <dl>
      - <dt>
      - <dd>
      - <a hreflang>
      - <blockquote cite>
      - <h2 id>
      - <h3 id>
      - <h4 id>
      - <h5 id>
      - <h6 id>
    linkit_extension:
      linkit_enabled: true
      linkit_profile: jarvis
    media_media:
      allow_view_mode_override: true
image_upload:
  status: true
  scheme: public
  directory: inline-images
  max_size: null
  max_dimensions:
    width: null
    height: null
