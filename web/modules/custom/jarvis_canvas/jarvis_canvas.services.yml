services:
  jarvis_canvas.overlay_alpha:
    class: Drupal\jarvis_canvas\OverlayAlpha
    arguments:
      - '@cache.default'

  jarvis_canvas.twig_extension:
    class: Drupal\jarvis_canvas\JarvisCanvasTwigExtension
    arguments:
      - '@entity_type.manager'
      - '@file_url_generator'
      - '@renderer'
      - '@file_system'
      - '@jarvis_canvas.overlay_alpha'
    tags:
      - { name: twig.extension }
