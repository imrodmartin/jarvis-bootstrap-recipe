name: 'Jarvis Canvas'
type: module
description: 'Canvas integration for the Jarvis theme — allows Basic/Full HTML text formats on block rich-text SDC props.'
package: Jarvis
core_version_requirement: ^11 || ^12
dependencies:
  - canvas:canvas
  - drupal:node
  # JarvisCanvasTwigExtension type-hints FileInterface and ImageStyleInterface
  # and loads the file / image_style storages — it fatals without these.
  - drupal:file
  - drupal:image
